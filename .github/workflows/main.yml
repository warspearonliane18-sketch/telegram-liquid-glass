name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Gradle task"
        default: "assembleAfatDebug"
        type: choice
        options:
          - assembleAfatDebug
          - assembleAfatRelease
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK / NDK / CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          [ -x "$SDKM" ] || SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Unpack ZIP archive
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n1)
          echo "Found ZIP: $ZIP_FILE"
          [ -n "$ZIP_FILE" ] || { echo "No .zip file found in repo"; exit 1; }
          mkdir -p ./unpacked_src
          unzip -o "$ZIP_FILE" -d ./unpacked_src
          ls -la ./unpacked_src

      - name: Build APK
        run: |
          ROOT=$(dirname "$(find ./unpacked_src -type d -name TMessagesProj_App -not -path '*/node_modules/*' | head -n1)")
          [ -n "$ROOT" ] && [ -d "$ROOT/TMessagesProj_App" ] || { echo "TMessagesProj_App not found in unpacked ZIP"; find ./unpacked_src -maxdepth 3; exit 1; }
          echo "Project root: $ROOT"
          cd "$ROOT"
          TASK="${{ github.event.inputs.variant || 'assembleAfatDebug' }}"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :TMessagesProj_App:$TASK --no-daemon --stacktrace
          else
            echo "gradlew missing -> installing Gradle 8.13"
            curl -sL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.13/bin/gradle :TMessagesProj_App:$TASK --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-apk
          path: '**/unpacked_src/**/TMessagesProj_App/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          
